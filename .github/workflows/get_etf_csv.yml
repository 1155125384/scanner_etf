name: Hourly ETF Update
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: etf-scanner-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
      APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
      SANDBOX_KEY: ${{ secrets.SANDBOX_APP_KEY }}
      SANDBOX_SECRET: ${{ secrets.SANDBOX_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install webull-python-sdk-core webull-python-sdk-trade webull-python-sdk-mdata requests yfinance pandas numpy tqdm

      - name: Run ETF Script and commit (x10)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          for i in $(seq 1 10); do
            echo "=== Run $i of 10 ==="
            git fetch origin main
            git reset --hard origin/main

            python scanner_etf.py

            git add etf_scanner.csv
            if git diff --cached --quiet; then
              echo "No changes to commit on run $i"
            else
              git commit -m "Auto-update ETF list: $(date) (run $i/10)"
              git push origin HEAD:main || { git fetch origin main && git reset --soft origin/main && git commit -m "Auto-update ETF list: $(date) (run $i/10)" && git push origin HEAD:main; }
            fi
          done
