name: Hourly ETF Update
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:   # Allows you to run it manually to test
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for saving the CSV back to your repo
    env:
      APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
      APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
      SANDBOX_KEY: ${{ secrets.SANDBOX_APP_KEY }}
      SANDBOX_SECRET: ${{ secrets.SANDBOX_APP_SECRET }}
      WEBULL_ACCESS_TOKEN: ${{ secrets.WEBULL_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"  # This is the magic line
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install webull-python-sdk-core webull-python-sdk-trade webull-python-sdk-mdata requests yfinance pandas numpy tqdm

      - name: Run ETF Script and commit (x10)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          for i in $(seq 1 10); do
            echo "=== Run $i of 10 ==="
            python scanner_etf.py

            git add etf_scanner.csv
            if git diff --cached --quiet; then
              echo "No changes to commit on run $i"
            else
              git commit -m "Auto-update ETF list: $(date) (run $i/10)"
              git pull --rebase origin main
              git push
            fi
          done
